[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobflow-resume-engine"
version = "0.1.0"
description = "Fact-grounded Chinese DOCX/PDF resume engine for JobFlow CN"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "python-docx>=1.2,<2",
  "reportlab>=4.4,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

