[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "job-orchestrator-cn"
version = "0.1.0"
description = "Local-first AI job application orchestrator for Chinese recruiting platforms"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "python-docx>=1.2,<2",
  "pypdf>=5.8,<7",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]
windows = [
  "pillow>=12,<13",
  "pyinstaller>=6.15,<7",
  "pystray>=0.19,<1",
]

[project.scripts]
jobflow = "job_orchestrator.__main__:main"

[tool.setuptools]
package-dir = {"" = "apps/api/src"}

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest_tmp"
pythonpath = ["apps/api/src", "third_party/resume_engine/src"]
testpaths = ["apps/api/tests", "third_party/resume_engine/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
